id: com.usebruno.Bruno
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: bruno
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=home
    # gh keeps its token in the system keyring by default
  - --talk-name=org.freedesktop.secrets
    # required to fix cursor scaling on wayland, especially with fractional scaling
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - name: git
    cleanup:
      - /share
    make-args:
      - NO_PERL=1
      - NO_TCLTK=1
      - NO_RUST=1
    make-install-args:
      - INSTALL_SYMLINKS=1
      - NO_PERL=1
      - NO_TCLTK=1
      - NO_RUST=1
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.gz
        sha256: 826817fd3671b8565586d6d49f688298de8354ab11db829c02720e5c74b9b39f
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://www.kernel.org/pub/software/scm/git/git-$version.tar.gz

  - name: unappimage
    buildsystem: simple
    build-options:
      cflags: "-std=gnu89"
    build-commands:
      - make -C squashfs-tools install INSTALL_DIR=/app/bin
    sources:
      - type: git
        url: https://github.com/refi64/unappimage
        commit: d7f86f2a0d7ec3a69211125207d5f127386b849a

  - name: gh
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/gh -t "${FLATPAK_DEST}/bin"
      - install -Dm644 LICENSE -t "${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/gh"
    sources:
      - type: archive
        url: https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz
        sha256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/cli/cli/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/cli/cli/releases/download/v" + $version + "/gh_" + $version + "_linux_amd64.tar.gz"'

  - name: bruno
    buildsystem: simple
    sources:
      - type: script
        dest-filename: bruno
        commands:
          # use the host gh login instead of the per-app config dir
          - export GH_CONFIG_DIR="${GH_CONFIG_DIR:-${HOST_XDG_CONFIG_HOME:-$HOME/.config}/gh}"
          # append the bundled gh as a git credential helper; host helpers such as /usr/local/bin/gh are kept but cannot run in the sandbox
          - n="${GIT_CONFIG_COUNT:-0}"
          - export "GIT_CONFIG_KEY_$n=credential.helper" "GIT_CONFIG_VALUE_$n=!/app/bin/gh auth git-credential" "GIT_CONFIG_COUNT=$((n + 1))"
          - zypak-wrapper.sh /app/extra/bruno/bruno --ozone-platform-hint=auto --enable-features=WaylandWindowDecorations "$@"

      - type: extra-data
        url: https://github.com/usebruno/bruno/releases/download/v4.3.0/bruno_4.3.0_x86_64_linux.AppImage
        sha256: 3c386b1007f66d875c34a2a502063fbad65c66e37409a316ebe518788b1e80bb
        filename: bruno.appimage
        size: 174598148

      - type: file
        path: apply_extra.sh

      - type: file
        path: com.usebruno.Bruno.desktop

      - type: file
        path: com.usebruno.Bruno.metainfo.xml

      - type: file
        path: com.usebruno.Bruno.png
    build-commands:
      - install -Dm755 ./apply_extra.sh "${FLATPAK_DEST}/bin/apply_extra"
      - install -Dm755 bruno -t "${FLATPAK_DEST}/bin/"
      - install -Dm644 "${FLATPAK_ID}.desktop" -t "${FLATPAK_DEST}/share/applications"
      - install -Dm644 "${FLATPAK_ID}.metainfo.xml" -t "${FLATPAK_DEST}/share/metainfo"
      - install -Dm644 com.usebruno.Bruno.png -t "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps"
